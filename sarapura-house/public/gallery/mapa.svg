  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <g stroke="#6b4a2c" stroke-width="3" fill="none" opacity="0.55" stroke-linecap="round" stroke-linejoin="round">
    
  <line x1="300" y1="120" x2="180" y2="1080"/><line x1="600" y1="120" x2="480" y2="1080"/><line x1="900" y1="120" x2="780" y2="1080"/><line x1="1200" y1="120" x2="1080" y2="1080"/>
  <line x1="80" y1="300" x2="1520" y2="240"/><line x1="80" y1="540" x2="1520" y2="480"/><line x1="80" y1="780" x2="1520" y2="720"/><line x1="80" y1="1020" x2="1520" y2="960"/>
  <circle cx="800" cy="560" r="26" fill="#7c5430" opacity="0.9"/>
  </g>
  <rect width="1600" height="1200" fill="transparent" filter="url(#n)"/>
  <g opacity="0.4">
    <rect x="40" y="40" width="1520" height="1120" fill="none" stroke="#6b4a2c" stroke-width="2"/>
  </g>
  <text x="800" y="1130" text-anchor="middle" font-family="Georgia, serif" font-size="42" fill="#6b4a2c" opacity="0.85" font-style="italic">Monserrat · Buenos Aires</text>
